# Dependabot：每周检查依赖更新
# - github-actions：保障 CI 使用的工作流 Action 持续更新
# - pub：Flutter 桌面版（app/）的 Dart/Flutter 依赖
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    commit-message:
      prefix: "chore(deps)"
