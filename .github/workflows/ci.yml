# .github/workflows/ci.yml
# SyncthingIgnorePatterns CI/CD
# - version:     从根 VERSION 读取主实现版本，校验 v* 标签与 VERSION 一致
# - validate:    校验 PowerShell GUI 语法、.stignore 规则集、分三轨校验版本一致性
# - build-windows: 在 windows-latest 构建 Flutter Windows 桌面 exe 并打包
# - release:     仅在推送 v* 标签时创建 GitHub Release 并上传产物
#
# 版本三轨独立（见 docs/project.md §4）：
#   Flutter 主实现  = VERSION（pubspec / AppState.version / README 徽章）
#   PowerShell 遗留 = SyncthingIgnoreGUI.ps1（//Version 与 $ScriptVersion 内部一致）
#   规则集 .stignore = 独立于工具发布的版本（.stignore 与 app/assets/.stignore 内部一致）
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SyncthingIgnoreGUI

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read VERSION
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Git tag v$tag does not match VERSION ($ver)"
            exit 1
          fi

  validate:
    name: Validate scripts & ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax check (SyncthingIgnoreGUI.ps1)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "SyncthingIgnoreGUI.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK"
      - name: Validate .stignore ruleset
        shell: pwsh
        run: |
          $lines = Get-Content .stignore
          $rules = for ($i = 0; $i -lt $lines.Count; $i++) {
            $t = $lines[$i].Trim()
            if ($t -eq '' -or $t.StartsWith('//') -or $t.StartsWith('#')) { continue }
            $t
          }
          Write-Host "Non-comment rule lines: $($rules.Count)"
          $dups = $rules | Group-Object | Where-Object { $_.Count -gt 1 } |
            Select-Object -ExpandProperty Name
          if ($dups) {
            Write-Warning "Duplicate rule patterns: $($dups -join ', ')"
          } else {
            Write-Host "No duplicate rule patterns"
          }
          if ($rules.Count -eq 0) { Write-Error ".stignore has no rules"; exit 1 }
      - name: Version consistency check (three independent tracks)
        shell: pwsh
        run: |
          # 1) Flutter 主实现版本（单一来源 = VERSION）必须全部一致
          $ver = (Get-Content VERSION | Out-String).Trim()
          $flutter = @(
            @{ file = 'app/pubspec.yaml';             pat = 'version:\s*([0-9.]+)' }
            @{ file = 'README.md';                    pat = 'version-v([0-9.]+)' }
            @{ file = 'README_EN.md';                 pat = 'version-v([0-9.]+)' }
            @{ file = 'app/lib/state/app_state.dart'; pat = "this\.version = '([0-9.]+)'" }
            @{ file = 'app/lib/models/manifest.dart'; pat = '"version":\s*"([0-9.]+)"' }
          )
          $fv = @($ver)
          foreach ($s in $flutter) {
            $c = Get-Content $s.file -Raw
            if ($c -match $s.pat) { $fv += $Matches[1] }
            else { Write-Error "No version found in $($s.file)"; exit 1 }
          }
          $fu = $fv | Sort-Object -Unique
          if ($fu.Count -ne 1) {
            Write-Error "Flutter track version mismatch: $($fv -join ' | ')"
            exit 1
          }
          Write-Host "Flutter track consistent: $ver"

          # 2) PowerShell 遗留版（独立演进，内部须一致）
          $ps1 = Get-Content SyncthingIgnoreGUI.ps1 -Raw
          $head = if ($ps1 -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          $scriptv = if ($ps1 -match '[$]ScriptVersion = ''([0-9.]+)''') { $Matches[1] } else { $null }
          if ($head -ne $scriptv) {
            Write-Error "PowerShell legacy version mismatch: //Version=$head `$ScriptVersion=$scriptv"
            exit 1
          }
          Write-Host "PowerShell legacy track consistent: $head (independent)"

          # 3) 规则集（独立版本，.stignore 与打包副本须一致）
          $rv  = if ((Get-Content .stignore -Raw) -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          $rav = if ((Get-Content app/assets/.stignore -Raw) -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          if ($rv -ne $rav) {
            Write-Error "Ruleset version mismatch: .stignore=$rv app/assets/.stignore=$rav"
            exit 1
          }
          Write-Host "Ruleset track consistent: $rv (independent)"

  build-windows:
    name: Build Flutter Windows (exe)
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release
      - name: Package artifact
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $zip = "${{ env.APP_NAME }}-v$ver-windows-x64.zip"
          $src = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: ${{ env.APP_NAME }}-v*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-v*-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
