# .github/workflows/ci.yml
# SyncthingIgnorePatterns CI/CD
# - version:       从根 VERSION 读取主实现版本，校验 v* 标签与 VERSION 一致
# - validate:      校验 PowerShell GUI 语法、.stignore 规则集、规则副本一致性（阻断）、分三轨校验版本一致性
# - build-windows: 在 windows-latest 构建 Flutter Windows 桌面 exe，跑测试与覆盖率（行覆盖率门禁 ≥80%）并打包产物
# - release:       仅在推送 v* 标签时创建 GitHub Release（说明取自 CHANGELOG）并上传产物
#
# 构建产物命名规范（与全局约定一致，见 docs/project.md §9.5）：
#   <产品名>-v<语义版本>-<os>-<arch>.<扩展名>
#   产品名 = env.APP_NAME（PascalCase 无空格）；os ∈ windows|macos|linux；arch ∈ x64|arm64；
#   Windows/macOS 用 zip、Linux 用 tar.gz；版本取自根 VERSION（needs.version.outputs.version），
#   禁止硬编码；Release 仅上传归档（不上传构建目录树）；预发布以 Release prerelease 标记区分。
#   CI 产物以「目录」形式在作业间传递（避免产物内再套一层压缩包导致二次压缩），
#   发布归档仅在 release 作业压缩生成。
#
# 版本三轨独立（见 docs/project.md §4）：
#   Flutter 主实现  = VERSION（pubspec / AppState.version / manifest 示例 / README 徽章）
#   PowerShell 遗留 = SyncthingIgnoreGUI.ps1（//Version 与 $ScriptVersion 内部一致）
#   规则集 .stignore = 独立于工具发布的版本（.stignore 与 app/assets/.stignore 内部一致）
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# 默认最小权限（只读）；仅 release 作业按需提权为 contents: write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 标签（发布）运行不取消，避免打断进行中的 Release；分支运行可被新提交取消
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  APP_NAME: SyncthingIgnoreGUI

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read VERSION
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Git tag v$tag does not match VERSION ($ver)"
            exit 1
          fi

  validate:
    name: Validate scripts & ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell syntax check (SyncthingIgnoreGUI.ps1)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "SyncthingIgnoreGUI.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK"
      - name: Validate .stignore ruleset
        shell: pwsh
        run: |
          $lines = Get-Content .stignore
          $rules = for ($i = 0; $i -lt $lines.Count; $i++) {
            $t = $lines[$i].Trim()
            if ($t -eq '' -or $t.StartsWith('//') -or $t.StartsWith('#')) { continue }
            $t
          }
          Write-Host "Non-comment rule lines: $($rules.Count)"
          $dups = $rules | Group-Object | Where-Object { $_.Count -gt 1 } |
            Select-Object -ExpandProperty Name
          if ($dups) {
            Write-Warning "Duplicate rule patterns: $($dups -join ', ')"
          } else {
            Write-Host "No duplicate rule patterns"
          }
          if ($rules.Count -eq 0) { Write-Error ".stignore has no rules"; exit 1 }
      - name: Ruleset copy consistency (.stignore vs app/assets/.stignore)
        shell: pwsh
        run: |
          # 阻断型检查：根 .stignore（标准源）与 app/assets/.stignore（运行时打包副本）
          # 必须逐行一致，否则打包进应用的规则集会滞后于标准源。
          # 规则更新后请同步两处（可用根文件覆盖副本），CI 会在此拦截不一致。
          $root = (Get-Content .stignore -Raw) -replace "`r`n", "`n"
          $copy = (Get-Content app/assets/.stignore -Raw) -replace "`r`n", "`n"
          if ($root -eq $copy) {
            Write-Host "Ruleset copies are identical"
            exit 0
          }
          $onlyRoot = Compare-Object ($root -split "`n") ($copy -split "`n") |
            Where-Object SideIndicator -eq '<=' | ForEach-Object InputObject
          $onlyCopy = Compare-Object ($root -split "`n") ($copy -split "`n") |
            Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject
          $msg = "Ruleset copies differ. Only in .stignore: [$($onlyRoot -join ', ')] | " +
                 "Only in app/assets/.stignore: [$($onlyCopy -join ', ')]"
          Write-Error $msg
          exit 1
      - name: Version consistency check (three independent tracks)
        shell: pwsh
        run: |
          # 1) Flutter 主实现版本（单一来源 = VERSION）必须全部一致
          $ver = (Get-Content VERSION | Out-String).Trim()
          $flutter = @(
            @{ file = 'app/pubspec.yaml';             pat = 'version:\s*([0-9.]+)' }
            @{ file = 'README.md';                    pat = 'version-v([0-9.]+)' }
            @{ file = 'README_EN.md';                 pat = 'version-v([0-9.]+)' }
            @{ file = 'app/lib/state/app_state.dart'; pat = "this\.version = '([0-9.]+)'" }
            @{ file = 'app/lib/models/manifest.dart'; pat = '"version":\s*"([0-9.]+)"' }
          )
          $fv = @($ver)
          foreach ($s in $flutter) {
            $c = Get-Content $s.file -Raw
            if ($c -match $s.pat) { $fv += $Matches[1] }
            else { Write-Error "No version found in $($s.file)"; exit 1 }
          }
          $fu = $fv | Sort-Object -Unique
          if ($fu.Count -ne 1) {
            Write-Error "Flutter track version mismatch: $($fv -join ' | ')"
            exit 1
          }
          Write-Host "Flutter track consistent: $ver"

          # 2) PowerShell 遗留版（独立演进，内部须一致）
          $ps1 = Get-Content SyncthingIgnoreGUI.ps1 -Raw
          $head = if ($ps1 -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          $scriptv = if ($ps1 -match '[$]ScriptVersion = ''([0-9.]+)''') { $Matches[1] } else { $null }
          if ($head -ne $scriptv) {
            Write-Error "PowerShell legacy version mismatch: //Version=$head `$ScriptVersion=$scriptv"
            exit 1
          }
          Write-Host "PowerShell legacy track consistent: $head (independent)"

          # 3) 规则集（独立版本，.stignore 与打包副本须一致）
          $rv  = if ((Get-Content .stignore -Raw) -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          $rav = if ((Get-Content app/assets/.stignore -Raw) -match '//Version:\s*([0-9.]+)') { $Matches[1] } else { $null }
          if ($rv -ne $rav) {
            Write-Error "Ruleset version mismatch: .stignore=$rv app/assets/.stignore=$rav"
            exit 1
          }
          Write-Host "Ruleset track consistent: $rv (independent)"

  build-windows:
    name: Build Flutter Windows (exe)
    needs: [version]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test (with coverage)
        working-directory: app
        run: flutter test --coverage
      - name: Coverage check (>= 80% lines)
        if: always()
        shell: pwsh
        working-directory: app
        run: |
          $f = 'coverage/lcov.info'
          if (-not (Test-Path $f)) { Write-Error "No coverage file found"; exit 1 }
          $lf = 0; $lh = 0
          foreach ($line in Get-Content $f) {
            if ($line.StartsWith('LF:')) { $lf += [int]$line.Substring(3) }
            elseif ($line.StartsWith('LH:')) { $lh += [int]$line.Substring(3) }
          }
          if ($lf -le 0) { Write-Error "Coverage file has no LF records"; exit 1 }
          $pct = [math]::Round($lh * 100 / $lf, 2)
          $msg = "Flutter line coverage: $pct% ($lh/$lf)"
          Write-Host $msg
          Write-Host "::notice title=Coverage::$msg"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Coverage`n`n$msg"
          $min = 80
          if ($pct -lt $min) {
            Write-Error "Coverage $pct% is below the required $min% line threshold"
            exit 1
          }
          Write-Host "Coverage meets the $min% line threshold"
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --tree-shake-icons
      - name: Stage release files
        shell: pwsh
        run: |
          # 收集运行所需文件到 staging 目录（剔除调试符号 *.pdb/*.exp/*.lib）。
          # 归档改在 release 作业压缩——CI 产物以「目录」形式传递，
          # 避免产物（upload-artifact 自带一层压缩）内再套一层压缩包导致二次压缩。
          $src = "app/build/windows/x64/runner/Release"
          $dst = "app/build/package"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $base = (Get-Item -LiteralPath $src).FullName
          Get-ChildItem $src -Recurse -File |
            Where-Object { $_.Extension -notin '.pdb', '.exp', '.lib' } |
            ForEach-Object {
              $rel = $_.FullName.Substring($base.Length + 1)
              $target = Join-Path $dst $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          # 附带 Visual C++ 运行库（vcruntime140/msvcp140/vcruntime140_1）。Flutter
          # Windows release 默认动态链接 CRT，flutter_windows.dll 依赖它们；干净
          # Windows 若未装 VC++ 2015-2022 Redistributable，exe 会在引擎加载阶段
          # 直接退出（无窗口闪退）。随包发布可让产物自包含、免装运行库。
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath 2>$null
          $crtDir = if ($vsRoot) {
            Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Recurse -Directory `
              -Filter 'Microsoft.VC143.CRT' -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($crtDir) {
            foreach ($dll in 'vcruntime140.dll', 'msvcp140.dll', 'vcruntime140_1.dll') {
              $dllSrc = Join-Path $crtDir.FullName $dll
              if (Test-Path $dllSrc) { Copy-Item -LiteralPath $dllSrc -Destination $dst }
            }
            Write-Host "Bundled VC++ runtime from $($crtDir.FullName)"
          } else {
            Write-Warning 'VC++ CRT not found; target machine may need Visual C++ Redistributable.'
          }
          Write-Host "Staged $((Get-ChildItem $dst -Recurse -File).Count) files to $dst"
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-v${{ needs.version.outputs.version }}-windows-x64
          path: app/build/package
          if-no-files-found: error
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [version, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-v${{ needs.version.outputs.version }}-windows-x64
          path: dist
      - name: Package release archive
        shell: pwsh
        run: |
          # 归档命名规范：<产品名>-v<版本>-<os>-<arch>.<扩展名>（docs/project.md §9.5）
          # 产物以「目录」形式在 build-windows 与 release 作业间传递，此处压缩为发布归档
          # 用 .NET SmallestSize 高压缩；CreateEntryFromFile 为扩展方法不可用，故用 CreateEntry + 流拷贝
          $ver = "${{ needs.version.outputs.version }}"
          $zip = "${{ env.APP_NAME }}-v$ver-windows-x64.zip"
          $src = "dist"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $level = [System.IO.Compression.CompressionLevel]::SmallestSize
          $base = (Get-Item -LiteralPath $src).FullName
          $fs = [System.IO.File]::Create($zip)
          $za = [System.IO.Compression.ZipArchive]::new($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          Get-ChildItem $src -Recurse -File |
            ForEach-Object {
              $rel = $_.FullName.Substring($base.Length + 1).Replace('\', '/')
              $entry = $za.CreateEntry($rel, $level)
              $out = $entry.Open()
              $in = [System.IO.File]::OpenRead($_.FullName)
              $in.CopyTo($out)
              $in.Dispose()
              $out.Dispose()
            }
          $za.Dispose()
          $fs.Dispose()
          Write-Host "Created $zip"
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $header = "## [v$ver]"
          $out = New-Object System.Collections.Generic.List[string]
          $capturing = $false
          foreach ($line in (Get-Content CHANGELOG.md)) {
            if (-not $capturing) {
              if ($line.StartsWith($header)) { $capturing = $true }
              continue
            }
            if ($line.StartsWith('## ')) { break }
            $out.Add($line)
          }
          while ($out.Count -gt 0 -and $out[0].Trim() -eq '') { $out.RemoveAt(0) }
          if ($out.Count -eq 0) { $out.Add("(CHANGELOG.md 中未找到 v$ver 小节)") }
          Set-Content -Path release_notes.md -Value ($out -join "`n") -Encoding utf8
          Write-Host "Extracted $($out.Count) lines for v$ver"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APP_NAME }}-v*-windows-x64.zip
          body_path: release_notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          # 预发布（版本号含 '-'，如 1.19.0-rc.1）以 prerelease 标记区分，不在文件名加后缀
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
